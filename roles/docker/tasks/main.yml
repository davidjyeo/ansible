---
- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }}
      stable
    #filename: docker
    state: present

- name: Install Docker packages
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Configure Docker daemon
  copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: Restart Docker

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  debug:
    var: docker_version.stdout

- name: Copy Docker Compose File
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "/srv/docker/media-stack/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
    backup: true
  # notify: Restart media stack

- name: Check Docker Compose file
  ansible.builtin.stat:
    path: /srv/docker/media-stack/docker-compose.yml
  register: docker_compose_file

- name: Assert Docker Compose file was copied
  ansible.builtin.assert:
    that:
      - docker_compose_file.stat.exists
      - docker_compose_file.stat.isreg
      - docker_compose_file.stat.pw_name == "root"
      - docker_compose_file.stat.gr_name == "root"
      - docker_compose_file.stat.mode == "0644"
    fail_msg: >-
      docker-compose.yml is missing or has incorrect permissions
      at /srv/docker/media-stack/docker-compose.yml
    success_msg: >-
      docker-compose.yml is present with the expected ownership
      and permissions
  notify: Restart media stack