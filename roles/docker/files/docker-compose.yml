services:

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    environment:
      # GF_SECURITY_ADMIN_USER: admin
      # GF_SECURITY_ADMIN_PASSWORD: admin
      # GF_USERS_ALLOW_SIGN_UP: "false"
      # GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      # GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_PLUGINS_PREINSTALL: grafana-clock-panel #,grafana-piechart-panel,grafana-simple-json-datasource
      TZ: Europe/London

    volumes:
      #- /srv/appdata/grafana/conf:/etc/grafana
      - /srv/appdata/grafana/data:/var/lib/grafana

    ports:
      - 3001:3000 # host:container

    dns:
      - 172.18.0.53

    networks:
      - media_net

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
      POSTGRES_DB: grafana

    volumes:
      #- /srv/appdata/postgres/data:/var/lib/postgresql/data
      - /srv/appdata/postgres:/var/lib/postgresql

    ports:
      - 5432:5432

    networks:
      - media_net

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped

    volumes:
      - /srv/appdata/adguard/work:/opt/adguardhome/work
      - /srv/appdata/adguard/conf:/opt/adguardhome/conf

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "3000:3000/tcp"

    environment:
      TZ: Europe/London
      PUID: 1000
      PGID: 1000

    security_opt:
      - no-new-privileges:true

    cap_add:
      - NET_ADMIN

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      media_net:
        ipv4_address: 172.18.0.53

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London

    volumes:
      - /srv/appdata/prowlarr/conf:/config

    ports:
      - 9696:9696

    dns:
      - 172.18.0.53

    restart: unless-stopped

    networks:
      - media_net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      WEBUI_PORT: 8080
      TORRENTING_PORT: 45321

    volumes:
      - /srv/appdata/qbittorrent/conf:/config
      - /srv/media/downloads:/downloads

    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp

    dns:
      - 172.18.0.53

    restart: unless-stopped

    networks:
      - media_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London

    volumes:
      - /srv/appdata/sonarr/conf:/config
      - /srv/media/tv:/tv
      - /srv/media/downloads:/downloads

    ports:
      - 8989:8989

    dns:
      - 172.18.0.53

    restart: unless-stopped
    networks:
      - media_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London

    volumes:
      - /srv/appdata/radarr/conf:/config
      - /srv/media/movies:/movies
      - /srv/media/downloads:/downloads

    ports:
      - 7878:7878

    dns:
      - 172.18.0.53

    restart: unless-stopped

    networks:
      - media_net

  # lidarr:
  #   image: lscr.io/linuxserver/lidarr:latest
  #   container_name: lidarr

  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     TZ: Europe/London

  #   volumes:
  #     - /srv/appdata/lidarr/conf:/config
  #     - /srv/media/music:/music
  #     - /srv/media/downloads:/downloads

  #   ports:
  #     - 8686:8686

  #   dns:
  #     - 172.18.0.53

  #   restart: unless-stopped

  #   networks:
  #     - media_net

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host

    dns:
      - 192.168.0.128

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      VERSION: docker

    devices:
      - /dev/dri:/dev/dri

    volumes:
      - /srv/appdata/plex/conf:/config
      - /srv/media/movies:/movies
      - /srv/media/tv:/tv
      - /srv/media/music:/music
      - /srv/transcode:/transcode:/transcode

    restart: unless-stopped

networks:
  media_net:
    ipam:
      config:
        - subnet: 172.18.0.0/24
    driver: bridge
