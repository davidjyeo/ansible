- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  apt:
    upgrade: dist

- name: Remove obsolete packages
  apt:
    autoremove: true

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - vim
      - git
      - unzip
      - htop
      - net-tools
      - fail2ban
      - dnsutils
      - jq
      - python3-pip
      - rsync
      - tree
      - smartmontools
      - intel-media-va-driver
      - vainfo
      - nfs-common
      - unattended-upgrades
      - apt-listchanges
      - python3-kubernetes
    state: present

