---
timezone: Europe/London

# wifi_enabled: true
# wifi_interface: wlp2s0
# wifi_ssid: jsd178v
# wifi_password: jR1RiQPjfRh4

k3s_write_kubeconfig_mode: "0644"
k3s_disable:
  - servicelb

k3s_node_labels:
  - "role=k3s"

k3s_packages:
  - open-iscsi
  - nfs-common

kubeconfig_path: /etc/rancher/k3s/k3s.yaml

metallb_namespace: metallb-system

metallb_address_pool:
  - 192.168.0.220-192.168.0.250

adguard_namespace: adguard
adguard_image: adguard/adguardhome:latest
adguard_storage_path: /var/lib/rancher/adguardhome
adguard_loadbalancer_ip: 192.168.0.240

plex_namespace: plex
plex_image: lscr.io/linuxserver/plex:latest
plex_loadbalancer_ip: 192.168.0.241
plex_config_path: /var/lib/rancher/plex
plex_media_path: /srv/media
plex_puid: "1000"
plex_pgid: "1000"
plex_tz: Europe/London

media_directories:
  - /srv/media/movies
  - /srv/media/tv
  - /srv/media/music
  - /srv/media/downloads