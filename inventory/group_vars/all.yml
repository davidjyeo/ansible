---
timezone: Europe/London

directories:
  - /srv/appdata
  - /srv/appdata/adguard
  - /srv/appdata/plex
  - /srv/appdata/qbittorrent
  - /srv/appdata/sonarr
  - /srv/appdata/radarr
  - /srv/appdata/lidarr
  - /srv/appdata/prowlarr
  - /srv/docker
  - /srv/docker/media-stack
  - /srv/media/movies
  - /srv/media/tv
  - /srv/media/music
  - /srv/media/downloads
  - /srv/media/downloads/incomplete
  - /srv/media/downloads/complete
  - /srv/transcode

remove_directories:
  - /srv/appdata/grafana
  - /srv/appdata/postgres
  - /srv/appdata/timescaledb
  - /srv/appdata/nodered
  - /srv/appdata/netdata

sysctl_settings:
  - name: vm.swappiness
    value: "10"

  - name: vm.vfs_cache_pressure
    value: "50"

  - name: fs.inotify.max_user_watches
    value: "1048576"

  - name: fs.inotify.max_user_instances
    value: "2048"

docker_users:
  - linuxadmin

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_compose_dir: /srv/docker/media-stack

docker_compose_files:
  - docker-compose.yml

docker_apt_architecture: >-
  {{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64']
  else 'amd64' }}

